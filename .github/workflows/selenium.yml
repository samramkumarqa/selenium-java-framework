name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 2 * * 1-5' # weekdays 08:15 IST: run in Chrome and Firefox
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [regression, smoke]
        default: regression

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'schedule' && fromJSON('["chrome","firefox"]') || fromJSON('["chrome"]') }}
    env:
      BROWSER: ${{ matrix.browser }}
      HEADLESS: 'true'
      # Optional: when both are set, test data is read from and results are written to Google Sheets.
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B test -Dsuite=${{ inputs.suite || 'regression' }}
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ matrix.browser }}
          path: |
            target/extent-report/
            target/test-results.csv
            target/surefire-reports/
          retention-days: 14
