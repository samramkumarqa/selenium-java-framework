# Defaults only. Override any key with -Dkey=value or an environment variable
# (e.g. BROWSER=firefox, HEADLESS=false, DATA_SOURCE=sheets).
# Secrets (Google credentials) are read from environment variables, never from this file.

base.url=https://automationexercise.com
browser=chrome
headless=true

timeout.seconds=15
page.load.timeout.seconds=40

# Where purchase test data comes from: auto | json | sheets
#   auto   = Google Sheets when GOOGLE_SHEET_ID and credentials are set, otherwise the JSON file
data.source=auto
data.json.path=testdata/purchases.json
sheets.data.range=TestData!A1:E
sheets.results.range=Results!A1
